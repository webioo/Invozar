<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple document icon integrated with first letter -->
  <g transform="translate(20, 40)">
    <!-- Minimalist invoice document -->
    <rect x="0" y="0" width="80" height="120" fill="#667eea" rx="8"/>
    <rect x="10" y="15" width="40" height="4" fill="white" rx="2" opacity="0.9"/>
    <rect x="10" y="30" width="60" height="3" fill="white" rx="1.5" opacity="0.7"/>
    <rect x="10" y="40" width="60" height="3" fill="white" rx="1.5" opacity="0.7"/>
    <line x1="10" y1="55" x2="70" y2="55" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <rect x="10" y="65" width="30" height="3" fill="white" rx="1.5" opacity="0.6"/>
    <rect x="45" y="65" width="15" height="3" fill="white" rx="1.5" opacity="0.6"/>
    <rect x="10" y="75" width="30" height="3" fill="white" rx="1.5" opacity="0.6"/>
    <rect x="45" y="75" width="15" height="3" fill="white" rx="1.5" opacity="0.6"/>
    <line x1="10" y1="90" x2="70" y2="90" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <rect x="45" y="100" width="25" height="5" fill="white" rx="2.5" opacity="0.9"/>
  </g>
  
  <!-- Main Text -->
  <text x="130" y="130" 
        font-family="'Arial Black', 'Arial Bold', sans-serif" 
        font-size="90" 
        font-weight="900" 
        fill="#2d3748">
    <tspan fill="#667eea">Invo</tspan><tspan fill="#764ba2">zar</tspan>
  </text>
  
  <!-- Small tagline -->
  <text x="135" y="165" 
        font-family="Arial, sans-serif" 
        font-size="20" 
        fill="#718096"
        letter-spacing="2">by Webio</text>
</svg>
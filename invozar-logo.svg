<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Invoice Document Icon -->
  <g transform="translate(50, 40)">
    <!-- Document background -->
    <rect x="0" y="0" width="180" height="220" fill="#667eea" rx="15"/>
    
    <!-- Folded corner effect -->
    <path d="M 180 0 L 180 40 L 140 40 Z" fill="#764ba2"/>
    
    <!-- Invoice lines (representing text) -->
    <rect x="20" y="30" width="100" height="8" fill="white" rx="4" opacity="0.9"/>
    <rect x="20" y="50" width="140" height="6" fill="white" rx="3" opacity="0.7"/>
    <rect x="20" y="65" width="130" height="6" fill="white" rx="3" opacity="0.7"/>
    
    <!-- Divider line -->
    <line x1="20" y1="90" x2="160" y2="90" stroke="white" stroke-width="2" opacity="0.5"/>
    
    <!-- Invoice items (table-like structure) -->
    <rect x="20" y="105" width="60" height="6" fill="white" rx="3" opacity="0.6"/>
    <rect x="90" y="105" width="30" height="6" fill="white" rx="3" opacity="0.6"/>
    <rect x="130" y="105" width="30" height="6" fill="white" rx="3" opacity="0.6"/>
    
    <rect x="20" y="120" width="60" height="6" fill="white" rx="3" opacity="0.6"/>
    <rect x="90" y="120" width="30" height="6" fill="white" rx="3" opacity="0.6"/>
    <rect x="130" y="120" width="30" height="6" fill="white" rx="3" opacity="0.6"/>
    
    <rect x="20" y="135" width="60" height="6" fill="white" rx="3" opacity="0.6"/>
    <rect x="90" y="135" width="30" height="6" fill="white" rx="3" opacity="0.6"/>
    <rect x="130" y="135" width="30" height="6" fill="white" rx="3" opacity="0.6"/>
    
    <!-- Total line (thicker) -->
    <line x1="20" y1="160" x2="160" y2="160" stroke="white" stroke-width="2" opacity="0.5"/>
    
    <!-- Total amount -->
    <rect x="90" y="175" width="70" height="10" fill="white" rx="5" opacity="0.9"/>
    
    <!-- Checkmark/approval symbol -->
    <circle cx="150" cy="200" r="18" fill="#10b981" opacity="0.95"/>
    <path d="M 143 200 L 148 205 L 157 193" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Text: Invozar -->
  <text x="280" y="160" 
        font-family="'Arial Black', 'Arial Bold', sans-serif" 
        font-size="95" 
        font-weight="900" 
        fill="#667eea"
        letter-spacing="-3">Invozar</text>
  
  <!-- Tagline -->
  <text x="285" y="200" 
        font-family="Arial, sans-serif" 
        font-size="26" 
        fill="#888"
        letter-spacing="1">Invoice Generator</text>
</svg>